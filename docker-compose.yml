# Language/Stack: Docker Compose v2 (Node.js 22 app + PostgreSQL 17)
# Tool: Claude Code agent harness (Claude desktop app), model claude-opus-5-5
# Prompt Summary: PA1 compose prompt; repointed by the PA2 prompt "Point the
#   Dockerfile, compose file, Sonar config and devsecops.yml at functional-codebase/"
# AI Contribution: 100% AI generated / 0% human refactored
# Human Modifications: none
# Verification: CI compose up + API integration tests; human review signed off by the student (Saniya Bhambhvani), 2026-11-17
# Confidence: High
# Runs project-assignment-2/functional-codebase (built by the root Dockerfile)
# with its own single-tenant PostgreSQL database. No other services.
# Usage: cp .env.example .env  (set POSTGRES_PASSWORD)  &&  docker compose up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_DIR: project-assignment-2/functional-codebase
    image: peer-review-evaluation-gateway:local
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-prg_app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-peer_review}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - prg-net

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peer_review}
      POSTGRES_USER: ${POSTGRES_USER:-prg_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - prg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - prg-net
    # No host port published: the database is reachable only from the app.

networks:
  prg-net:
    driver: bridge

volumes:
  prg-db-data:
